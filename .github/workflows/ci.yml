name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz"
          download="$RUNNER_TEMP/$archive"
          install_root="$RUNNER_TEMP/ripgrep"
          curl --fail --location --retry 3 \
            --output "$download" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$archive"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $download" | sha256sum --check
          mkdir -p "$install_root"
          tar --extract --gzip --file "$download" --directory "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          "$install_root/rg" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Verify AM1 working-state evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm memory:working:benchmark
          mapfile -t reports < <(find .bornagent/evals/agent-memory/working/reports -maxdepth 1 -type f -name 'agent-memory-working-state-*.json' -print)
          test "${#reports[@]}" -eq 1
          pnpm memory:working:validate -- --report "${reports[0]}"

      - name: Record repository verification evidence
        run: >-
          pnpm architecture:report
          "${{ runner.temp }}/architecture-default-command.json"
          as0.1.default.repository-check

      - name: Verify Phase 21A focused gate
        env:
          BORN_PHASE21A_REPORT: ${{ runner.temp }}/architecture-phase21a.json
        run: pnpm phase21a:gate

      - name: Verify architecture evidence contract self-tests
        run: >-
          pnpm test
          tests/unit/architecture-simplification-evidence.test.ts
          --maxWorkers=1
          --reporter=json
          --outputFile=${{ runner.temp }}/architecture-self-test.json

      - name: Validate default architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: default
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-default-command.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","check"]'
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-phase21a.json
          BORN_ARCHITECTURE_REPORT_2_ARGV: '["pnpm","phase21a:gate"]'
          BORN_ARCHITECTURE_REPORT_3: ${{ runner.temp }}/architecture-self-test.json
          BORN_ARCHITECTURE_REPORT_3_ARGV: '["pnpm","test","tests/unit/architecture-simplification-evidence.test.ts","--maxWorkers=1","--reporter=json","--outputFile=${{ runner.temp }}/architecture-self-test.json"]'
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-default-receipt.json
        run: |
          pnpm architecture:gate
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-default-receipt.json"

      - name: Generate AS0.2 architecture characterization
        run: >-
          pnpm architecture:characterize -- --check
          --report "${{ runner.temp }}/architecture-as0.2-command.json"

      - name: Verify architecture metric cases through AS5.2
        run: >-
          pnpm test
          tests/unit/architecture-simplification-characterization.test.ts
          tests/unit/architecture-simplification-handoff-v2.test.ts
          tests/unit/architecture-simplification-bounded-scanner.test.ts
          tests/unit/architecture-simplification-local-application-host.test.ts
          tests/unit/architecture-simplification-runtime-attenuation.test.ts
          tests/unit/architecture-simplification-exact-session-evidence.test.ts
          tests/unit/architecture-simplification-run-cancellation-lifecycle.test.ts
          tests/unit/architecture-simplification-session-registry-read-path.test.ts
          tests/unit/architecture-simplification-product-tui-boundary.test.ts
          tests/unit/architecture-simplification-run-termination.test.ts
          tests/unit/architecture-simplification-projection-ownership.test.ts
          --maxWorkers=1
          --reporter=json
          --outputFile=${{ runner.temp }}/architecture-as0.2-vitest.json

      - name: Validate AS0.2 metric architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: metric
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-as0.2-command.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","architecture:characterize","--","--check","--report","${{ runner.temp }}/architecture-as0.2-command.json"]'
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-as0.2-vitest.json
          BORN_ARCHITECTURE_REPORT_2_ARGV: '["pnpm","test","tests/unit/architecture-simplification-characterization.test.ts","tests/unit/architecture-simplification-handoff-v2.test.ts","tests/unit/architecture-simplification-bounded-scanner.test.ts","tests/unit/architecture-simplification-local-application-host.test.ts","tests/unit/architecture-simplification-runtime-attenuation.test.ts","tests/unit/architecture-simplification-exact-session-evidence.test.ts","tests/unit/architecture-simplification-run-cancellation-lifecycle.test.ts","tests/unit/architecture-simplification-session-registry-read-path.test.ts","tests/unit/architecture-simplification-product-tui-boundary.test.ts","tests/unit/architecture-simplification-run-termination.test.ts","tests/unit/architecture-simplification-projection-ownership.test.ts","--maxWorkers=1","--reporter=json","--outputFile=${{ runner.temp }}/architecture-as0.2-vitest.json"]'
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-as0.2-receipt.json
        run: |
          pnpm architecture:gate
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-as0.2-receipt.json"

      - name: Verify built background worker paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        shell: bash
        run: |
          set +e
          pnpm test \
            tests/integration/phase19d-background-worker.test.ts \
            tests/integration/phase20d-background-worker-delegation.test.ts \
            tests/integration/phase20d-background-worker-readonly.test.ts \
            tests/integration/phase20d-real-coordinator-takeover.test.ts \
            --maxWorkers=1 \
            --reporter=json \
            --outputFile=${{ runner.temp }}/architecture-built-worker.json
          test_exit=$?
          set -e
          if (( test_exit != 0 )); then
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-worker.json" || true
            exit "$test_exit"
          fi

      - name: Verify built Phase 20C paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        shell: bash
        run: |
          set +e
          pnpm test \
            tests/integration/phase20c-pre-effect-retry.test.ts \
            tests/integration/phase20c-coding-worktree.test.ts \
            --maxWorkers=1 \
            --reporter=json \
            --outputFile=${{ runner.temp }}/architecture-built-phase20c.json
          test_exit=$?
          set -e
          if (( test_exit != 0 )); then
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-phase20c.json" || true
            exit "$test_exit"
          fi

      - name: Verify built Phase 20E paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        shell: bash
        run: |
          set +e
          pnpm test \
            tests/integration/phase20e-tui-pty.test.ts \
            tests/integration/phase20e-coding-tui-pty.test.ts \
            tests/integration/phase20e-promotion-composition.test.ts \
            --maxWorkers=1 \
            --reporter=json \
            --outputFile=${{ runner.temp }}/architecture-built-phase20e.json
          test_exit=$?
          set -e
          if (( test_exit != 0 )); then
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-phase20e.json" || true
            exit "$test_exit"
          fi

      - name: Validate built-path architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: built_paths
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-built-worker.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","test","tests/integration/phase19d-background-worker.test.ts","tests/integration/phase20d-background-worker-delegation.test.ts","tests/integration/phase20d-background-worker-readonly.test.ts","tests/integration/phase20d-real-coordinator-takeover.test.ts","--maxWorkers=1","--reporter=json","--outputFile=${{ runner.temp }}/architecture-built-worker.json"]'
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-built-phase20c.json
          BORN_ARCHITECTURE_REPORT_2_ARGV: '["pnpm","test","tests/integration/phase20c-pre-effect-retry.test.ts","tests/integration/phase20c-coding-worktree.test.ts","--maxWorkers=1","--reporter=json","--outputFile=${{ runner.temp }}/architecture-built-phase20c.json"]'
          BORN_ARCHITECTURE_REPORT_3: ${{ runner.temp }}/architecture-built-phase20e.json
          BORN_ARCHITECTURE_REPORT_3_ARGV: '["pnpm","test","tests/integration/phase20e-tui-pty.test.ts","tests/integration/phase20e-coding-tui-pty.test.ts","tests/integration/phase20e-promotion-composition.test.ts","--maxWorkers=1","--reporter=json","--outputFile=${{ runner.temp }}/architecture-built-phase20e.json"]'
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-built-paths-receipt.json
        run: |
          pnpm architecture:gate
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-built-paths-receipt.json"

      - name: Smoke packed artifact
        run: pnpm pack:smoke

      - name: Record packed artifact evidence
        run: >-
          pnpm architecture:report
          "${{ runner.temp }}/architecture-pack-command.json"
          existing.pack.installed-tarball-smoke

      - name: Validate packed artifact architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: pack
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-pack-command.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","pack:smoke"]'
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-pack-receipt.json
        run: |
          pnpm architecture:gate
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-pack-receipt.json"

  windows-phase20:
    name: windows-phase20
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install pinned ripgrep
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "ripgrep-15.1.0-x86_64-pc-windows-msvc.zip"
          $download = Join-Path $env:RUNNER_TEMP $archive
          $installRoot = Join-Path $env:RUNNER_TEMP "ripgrep"
          $assetUrl = "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$archive"
          Invoke-WebRequest -Uri $assetUrl -OutFile $download
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $download).Hash.ToLowerInvariant()
          $expectedSha256 = "124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a"
          if ($actualSha256 -ne $expectedSha256) {
            throw "ripgrep archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $download -DestinationPath $installRoot -Force
          $binaryRoot = Join-Path $installRoot "ripgrep-15.1.0-x86_64-pc-windows-msvc"
          $binary = Join-Path $binaryRoot "rg.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "ripgrep archive did not contain the expected rg.exe"
          }
          $binaryRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $binary --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        env:
          BORN_CI_WINDOWS_SERIAL_TESTS: "1"
        run: pnpm check

      - name: Verify AM1 working-state evidence
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          pnpm memory:working:benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reports = @(Get-ChildItem -LiteralPath ".bornagent/evals/agent-memory/working/reports" -File -Filter "agent-memory-working-state-*.json")
          if ($reports.Count -ne 1) { throw "expected exactly one AM1 working-state report" }
          pnpm memory:working:validate -- --report $reports[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record repository verification evidence
        run: >-
          pnpm architecture:report
          "${{ runner.temp }}/architecture-default-command.json"
          as0.1.default.repository-check

      - name: Verify Phase 21A focused gate
        env:
          BORN_PHASE21A_REPORT: ${{ runner.temp }}/architecture-phase21a.json
        run: pnpm phase21a:gate

      - name: Verify architecture evidence contract self-tests
        run: >-
          pnpm test
          tests/unit/architecture-simplification-evidence.test.ts
          --maxWorkers=1
          --reporter=json
          --outputFile=${{ runner.temp }}/architecture-self-test.json

      - name: Validate default architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: default
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-default-command.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","check"]'
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-phase21a.json
          BORN_ARCHITECTURE_REPORT_2_ARGV: '["pnpm","phase21a:gate"]'
          BORN_ARCHITECTURE_REPORT_3: ${{ runner.temp }}/architecture-self-test.json
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-default-receipt.json
        run: |
          $defaultEvidenceArgv = @(
            "pnpm",
            "test",
            "tests/unit/architecture-simplification-evidence.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=$env:BORN_ARCHITECTURE_REPORT_3"
          )
          $env:BORN_ARCHITECTURE_REPORT_3_ARGV = $defaultEvidenceArgv | ConvertTo-Json -Compress
          pnpm architecture:gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-default-receipt.json"

      - name: Generate Windows AS0.2 architecture characterization
        run: >-
          pnpm architecture:characterize -- --check
          --report "${{ runner.temp }}/architecture-as0.2-command.json"

      - name: Verify Windows architecture metric cases through AS5.2
        run: >-
          pnpm test
          tests/unit/architecture-simplification-characterization.test.ts
          tests/unit/architecture-simplification-handoff-v2.test.ts
          tests/unit/architecture-simplification-bounded-scanner.test.ts
          tests/unit/architecture-simplification-local-application-host.test.ts
          tests/unit/architecture-simplification-runtime-attenuation.test.ts
          tests/unit/architecture-simplification-exact-session-evidence.test.ts
          tests/unit/architecture-simplification-run-cancellation-lifecycle.test.ts
          tests/unit/architecture-simplification-session-registry-read-path.test.ts
          tests/unit/architecture-simplification-product-tui-boundary.test.ts
          tests/unit/architecture-simplification-run-termination.test.ts
          tests/unit/architecture-simplification-projection-ownership.test.ts
          --maxWorkers=1
          --reporter=json
          --outputFile=${{ runner.temp }}/architecture-as0.2-vitest.json

      - name: Validate Windows AS0.2 metric architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: metric
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-as0.2-command.json
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-as0.2-vitest.json
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-as0.2-receipt.json
        run: |
          $metricCharacterizationArgv = @(
            "pnpm",
            "architecture:characterize",
            "--",
            "--check",
            "--report",
            $env:BORN_ARCHITECTURE_REPORT_1
          )
          $metricTestsArgv = @(
            "pnpm",
            "test",
            "tests/unit/architecture-simplification-characterization.test.ts",
            "tests/unit/architecture-simplification-handoff-v2.test.ts",
            "tests/unit/architecture-simplification-bounded-scanner.test.ts",
            "tests/unit/architecture-simplification-local-application-host.test.ts",
            "tests/unit/architecture-simplification-runtime-attenuation.test.ts",
            "tests/unit/architecture-simplification-exact-session-evidence.test.ts",
            "tests/unit/architecture-simplification-run-cancellation-lifecycle.test.ts",
            "tests/unit/architecture-simplification-session-registry-read-path.test.ts",
            "tests/unit/architecture-simplification-product-tui-boundary.test.ts",
            "tests/unit/architecture-simplification-run-termination.test.ts",
            "tests/unit/architecture-simplification-projection-ownership.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=$env:BORN_ARCHITECTURE_REPORT_2"
          )
          $env:BORN_ARCHITECTURE_REPORT_1_ARGV = $metricCharacterizationArgv | ConvertTo-Json -Compress
          $env:BORN_ARCHITECTURE_REPORT_2_ARGV = $metricTestsArgv | ConvertTo-Json -Compress
          pnpm architecture:gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-as0.2-receipt.json"

      - name: Verify Windows built background worker paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        run: |
          $testArgs = @(
            "test",
            "tests/integration/phase19d-background-worker.test.ts",
            "tests/integration/phase20d-background-worker-delegation.test.ts",
            "tests/integration/phase20d-background-worker-readonly.test.ts",
            "tests/integration/phase20d-real-coordinator-takeover.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=${{ runner.temp }}/architecture-built-worker.json"
          )
          pnpm @testArgs
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-worker.json"
            exit $testExit
          }

      - name: Verify Windows built Phase 20C paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        run: |
          $testArgs = @(
            "test",
            "tests/integration/phase20c-pre-effect-retry.test.ts",
            "tests/integration/phase20c-coding-worktree.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=${{ runner.temp }}/architecture-built-phase20c.json"
          )
          pnpm @testArgs
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-phase20c.json"
            exit $testExit
          }

      - name: Verify Windows built Phase 20E paths
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        run: |
          $testArgs = @(
            "test",
            "tests/integration/phase20e-tui-pty.test.ts",
            "tests/integration/phase20e-coding-tui-pty.test.ts",
            "tests/integration/phase20e-promotion-composition.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=${{ runner.temp }}/architecture-built-phase20e.json"
          )
          pnpm @testArgs
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            node scripts/report-vitest-failures.mjs "${{ runner.temp }}/architecture-built-phase20e.json"
            exit $testExit
          }

      - name: Validate Windows built-path architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: built_paths
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-built-worker.json
          BORN_ARCHITECTURE_REPORT_2: ${{ runner.temp }}/architecture-built-phase20c.json
          BORN_ARCHITECTURE_REPORT_3: ${{ runner.temp }}/architecture-built-phase20e.json
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-built-paths-receipt.json
        run: |
          $builtWorkerArgv = @(
            "pnpm",
            "test",
            "tests/integration/phase19d-background-worker.test.ts",
            "tests/integration/phase20d-background-worker-delegation.test.ts",
            "tests/integration/phase20d-background-worker-readonly.test.ts",
            "tests/integration/phase20d-real-coordinator-takeover.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=$env:BORN_ARCHITECTURE_REPORT_1"
          )
          $builtPhase20cArgv = @(
            "pnpm",
            "test",
            "tests/integration/phase20c-pre-effect-retry.test.ts",
            "tests/integration/phase20c-coding-worktree.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=$env:BORN_ARCHITECTURE_REPORT_2"
          )
          $builtPhase20eArgv = @(
            "pnpm",
            "test",
            "tests/integration/phase20e-tui-pty.test.ts",
            "tests/integration/phase20e-coding-tui-pty.test.ts",
            "tests/integration/phase20e-promotion-composition.test.ts",
            "--maxWorkers=1",
            "--reporter=json",
            "--outputFile=$env:BORN_ARCHITECTURE_REPORT_3"
          )
          $env:BORN_ARCHITECTURE_REPORT_1_ARGV = $builtWorkerArgv | ConvertTo-Json -Compress
          $env:BORN_ARCHITECTURE_REPORT_2_ARGV = $builtPhase20cArgv | ConvertTo-Json -Compress
          $env:BORN_ARCHITECTURE_REPORT_3_ARGV = $builtPhase20eArgv | ConvertTo-Json -Compress
          pnpm architecture:gate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-built-paths-receipt.json"

      - name: Smoke packed artifact
        run: pnpm pack:smoke

      - name: Record packed artifact evidence
        run: >-
          pnpm architecture:report
          "${{ runner.temp }}/architecture-pack-command.json"
          existing.pack.installed-tarball-smoke

      - name: Validate Windows packed artifact architecture evidence
        env:
          BORN_ARCHITECTURE_PROFILE: pack
          BORN_ARCHITECTURE_REPORT_1: ${{ runner.temp }}/architecture-pack-command.json
          BORN_ARCHITECTURE_REPORT_1_ARGV: '["pnpm","pack:smoke"]'
          BORN_ARCHITECTURE_RECEIPT_OUT: ${{ runner.temp }}/architecture-pack-receipt.json
        run: |
          pnpm architecture:gate
          pnpm architecture:gate -- --receipt "${{ runner.temp }}/architecture-pack-receipt.json"
