name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install pinned ripgrep
        shell: bash
        run: |
          set -euo pipefail
          archive="ripgrep-15.1.0-x86_64-unknown-linux-musl.tar.gz"
          download="$RUNNER_TEMP/$archive"
          install_root="$RUNNER_TEMP/ripgrep"
          curl --fail --location --retry 3 \
            --output "$download" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/$archive"
          echo "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599  $download" | sha256sum --check
          mkdir -p "$install_root"
          tar --extract --gzip --file "$download" --directory "$install_root" --strip-components=1
          echo "$install_root" >> "$GITHUB_PATH"
          "$install_root/rg" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm check

      - name: Verify built background worker
        env:
          BORN_RUN_BUILT_WORKER_TEST: "1"
        run: pnpm exec vitest run tests/integration/phase19d-background-worker.test.ts --maxWorkers=1

      - name: Smoke packed artifact
        run: pnpm pack:smoke
